[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-provider-datax-openlineage"
version = "0.1.0"
description = "Airflow custom operator that executes DataX jobs and emits OpenLineage lineage events"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "apache-airflow>=2.7.0",
    "openlineage-python>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_provider_datax_openlineage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
